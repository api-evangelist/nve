name: NVE Corporation
description: 'NVE Corporation (nve.com, NASDAQ: NVEC) is a leader in the practical commercialization
  of spintronics, a nanotechnology that relies on electron spin rather than electron charge to acquire,
  store, and transmit information. NVE designs and manufactures spintronic GMR and TMR magnetic sensors
  (analog, angle/rotation, current, gear-tooth, and medical sensors), digital signal isolators (CAN,
  RS-422/485, PLC, battery-management, and power interfaces), and power-management ICs. Its developer
  surface is hardware-oriented: PDF datasheets, application notes, reference designs, magnetic-field
  calculators/web apps, a YouTube channel, and Arduino/embedded sample code on GitHub. NVE publishes no
  software/web API, OpenAPI or AsyncAPI specification, SDK, or developer API platform.'
